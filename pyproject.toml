[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verienvelope"
version = "0.1.0"
description = "Experimental measurement pipeline for software component capability envelopes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.22,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.package-dir]
"" = "runner"

[tool.setuptools.packages.find]
where = ["runner"]

[tool.pytest.ini_options]
pythonpath = ["runner", "."]
testpaths = ["tests"]
